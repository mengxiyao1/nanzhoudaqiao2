<!doctype html>
<html lang="ch-cn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>温度评估 - 桥梁监测系统</title>
<link href="./static/admin/css/bootstrap.min.css" rel="stylesheet">
<style>
body{margin:0;color:#dff6ff;font-family:"Microsoft YaHei",sans-serif;min-height:100vh;background:radial-gradient(1000px 420px at 50% -10%,rgba(26,140,255,.18),transparent 70%),linear-gradient(rgba(39,230,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(39,230,255,.03) 1px,transparent 1px),linear-gradient(160deg,#061830,#04101f 60%,#050d1c);background-size:100% 100%,42px 42px,42px 42px,100% 100%;background-attachment:fixed;}
.header{background:linear-gradient(180deg,rgba(6,24,48,.95),rgba(6,20,40,.8));padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(39,230,255,.25);box-shadow:0 2px 18px rgba(0,0,0,.35),0 0 16px rgba(39,230,255,.12);}
.header h2{margin:0;color:#f2fcff;font-size:20px;letter-spacing:2px;text-shadow:0 0 14px rgba(39,230,255,.6);}
.header .time{color:#8fd8ff;text-shadow:0 0 8px rgba(39,230,255,.5);}
.container{padding:24px;}
.card{background:linear-gradient(160deg,rgba(10,36,70,.6),rgba(6,22,46,.5));border:1px solid rgba(39,230,255,.22);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:inset 0 0 26px rgba(26,140,255,.07),0 8px 28px rgba(0,0,0,.35);backdrop-filter:blur(8px);animation:techIn .55s ease both;}
.card h3{margin:0 0 14px;color:#9feeff;font-size:16px;letter-spacing:1px;text-shadow:0 0 10px rgba(39,230,255,.45);}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(39,230,255,.12);}
th{color:#9feeff;letter-spacing:1px;background:linear-gradient(180deg,rgba(26,140,255,.3),rgba(12,60,110,.4));box-shadow:inset 0 -1px 0 rgba(39,230,255,.4);}
tbody tr:hover{background:rgba(39,230,255,.08);}
.empty{color:#7fa4c4;text-align:center;padding:36px;letter-spacing:2px;}
@keyframes techIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="header">
  <h2>桥梁监测系统 - 温度评估</h2>
  <span class="time" id="now"></span>
</div>
<div class="container">
  <div class="card">
    <h3>传感器列表</h3>
        <div class="empty">暂无传感器数据</div>
      </div>
</div>
<script>document.getElementById('now').textContent=new Date().toLocaleString('zh-CN');</script>
</body>
</html>
