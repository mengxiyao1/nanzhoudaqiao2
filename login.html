<html><head>

    <link href="./static/admin/style/font-awesome.css" rel="stylesheet">
    <link href="./static/admin/style/weather-icons.css" rel="stylesheet">

    <style>
        /* 科技指挥中心风登录页（自包含，不依赖缺失的 style 目录） */
        *{box-sizing:border-box;}
        html,body{height:100%;margin:0;}
        body{
            background:
                radial-gradient(900px 420px at 50% -10%, rgba(26,140,255,.22), transparent 70%),
                radial-gradient(700px 460px at 50% 115%, rgba(39,230,255,.12), transparent 70%),
                linear-gradient(rgba(39,230,255,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(39,230,255,.035) 1px, transparent 1px),
                linear-gradient(160deg,#061830 0%,#04101f 55%,#050d1c 100%) !important;
            background-size:100% 100%,100% 100%,42px 42px,42px 42px,100% 100% !important;
            background-attachment:fixed !important;
            font-family:"Microsoft YaHei","微软雅黑",sans-serif !important;
            display:flex;align-items:center;justify-content:center;
        }
        .main-container,.page-container{display:flex;align-items:center;justify-content:center;width:100%;padding:20px;}
        .login-container{width:100%;max-width:400px;animation:loginIn .6s ease both;}
        .logobox H4{
            color:#f2fcff !important;text-align:center;font-weight:400;letter-spacing:3px;
            text-shadow:0 0 16px rgba(39,230,255,.7),0 0 40px rgba(26,140,255,.5);
            margin:0 0 22px;font-size:22px;
        }
        .loginbox{
            background:linear-gradient(160deg,rgba(10,36,70,.62),rgba(6,22,46,.55)) !important;
            border:1px solid rgba(39,230,255,.28) !important;
            border-radius:16px !important;
            padding:30px 30px 24px !important;
            box-shadow:inset 0 0 30px rgba(26,140,255,.1),0 14px 44px rgba(0,0,0,.5),0 0 30px rgba(39,230,255,.12) !important;
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            position:relative;
        }
        .loginbox:before,.loginbox:after{content:"";position:absolute;width:18px;height:18px;pointer-events:none;
            background:
                linear-gradient(#27e6ff,#27e6ff) left top/100% 2px no-repeat,
                linear-gradient(#27e6ff,#27e6ff) left top/2px 100% no-repeat;
            filter:drop-shadow(0 0 4px rgba(39,230,255,.8));}
        .loginbox:before{top:-1px;left:-1px;}
        .loginbox:after{bottom:-1px;right:-1px;transform:rotate(180deg);}
        .loginbox-title{
            color:#f2fcff !important;font-size:18px;letter-spacing:4px;text-align:center;
            text-shadow:0 0 12px rgba(39,230,255,.55);margin-bottom:18px;
        }
        .social-title{color:#7fa4c4 !important;text-align:center;font-size:13px;margin-bottom:8px;}
        .loginbox-or{display:none;}
        .loginbox-textbox{margin-bottom:16px;}
        .loginbox-textbox .form-control{
            background:rgba(4,16,31,.6) !important;
            border:1px solid rgba(39,230,255,.28) !important;
            border-radius:8px !important;height:44px;color:#eafaff !important;
            padding:0 14px;transition:all .25s;
        }
        .loginbox-textbox .form-control:focus{
            border-color:#27e6ff !important;outline:none;
            box-shadow:0 0 0 3px rgba(39,230,255,.15) !important;background:rgba(4,16,31,.85) !important;
        }
        .btn-primary{
            background:linear-gradient(180deg,rgba(39,230,255,.32),rgba(26,140,255,.24)) !important;
            border:1px solid rgba(39,230,255,.6) !important;border-radius:8px !important;height:44px;
            color:#eafaff !important;letter-spacing:8px;font-size:16px;cursor:pointer;
            text-shadow:0 0 8px rgba(39,230,255,.5);transition:all .25s;
        }
        .btn-primary:hover{
            background:linear-gradient(180deg,rgba(39,230,255,.55),rgba(26,140,255,.4)) !important;
            box-shadow:0 0 20px rgba(39,230,255,.55) !important;color:#fff !important;
        }
        @keyframes loginIn{from{opacity:0;transform:translateY(18px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
    </style>
</head>
<body>

    <div class="main-container container-fluid">
        <div class="page-container">
    <!-- 头部 -->


    <!-- /头部 -->
    <div class="login-container animated fadeInDown">
                <div class="logobox">
            <div class="text-center">
                <H4>Fast反射面温度heatmap监测系统</H4>
            </div>
        </div>
        <div class="loginbox bg-white">
            <div class="loginbox-title">登录系统</div>
            <div class="loginbox-social">
                <div class="social-title ">(联系系统管理员添加账号)</div>
<!--                 <div class="social-buttons">
                    <a href="" class="button-facebook">

                    <a href="" class="button-twitter">

                    <a href="" class="button-google">

                    </a>
                </div> -->
            </div>
            <div class="loginbox-or">
                <div class="or-line"></div>
                <div class="or">OR</div>
            </div>
            <form class="form-horizontal" role="form" action="" method="post">
                <div class="loginbox-textbox">
                    <input name="username" type="text" class="form-control" placeholder="名称" />
                </div>
                <div class="loginbox-textbox">
                    <input name="password" type="Password" class="form-control" placeholder="密码" />
                </div>
                <div class="loginbox-forgot">
                    <!-- <a href="">Forgot Password?</a> -->
                </div>
                <div class="loginbox-submit">
                    <input type="submit" class="btn btn-primary btn-lg btn-block" value="登录">
                </div>
            </form>
            <form class="form-horizontal" role="form" action="" method="post">
                <div class="loginbox-textbox"style ="display:none">
                    <input name="username" type="text" class="form-control" placeholder="名称" value="xj123"/>
                </div>
                <div class="loginbox-textbox"style ="display:none">
                    <input name="password" type="Password" class="form-control" placeholder="密码" value="xj123"/>
                </div>
                <div class="loginbox-forgot"style ="display:none">
                </div>
                <!-- <div class="loginbox-submit">
                    <input type="submit" class="btn btn-secondary btn-lg btn-block" value="游客登录">
                </div> -->
            </form>
        </div>
    </div>
</div>
</div>
