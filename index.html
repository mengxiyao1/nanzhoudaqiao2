    gridHelper: null,
    sky: null,
    starField: null
};

//初始化渲染器
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true })
renderer.setSize(box.clientWidth, box.clientHeight)
renderer.setPixelRatio(window.devicePixelRatio * 2)

// 上方法导致模型不显示 改为设置背景色
renderer.setClearColor(0x0a1a2a, 1.0);

//scene.add(sceneElements.sky);
        
// 添加星星（浅色主题使用浅蓝色星星）
const starsGeometry = new THREE.BufferGeometry();
const starsMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.45,
    transparent: true,
    opacity: 0.8
});
const lightStarsMaterial = new THREE.PointsMaterial({
    color: 0x87ceeb, // 浅蓝色
    size: 0.45,
    transparent: true,
    opacity: 0.8
});

const starsVertices = [];
for (let i = 0; i < 1600; i++) {
    const x = (Math.random() - 0.5) * 900;
    const y = (Math.random() - 0.5) * 900;
    const z = (Math.random() - 0.5) * 900;
    
    // 确保星星在半球外
    const distance = Math.sqrt(x*x + y*y + z*z);
    if (distance > 50) {
        starsVertices.push(x, y, z);
    }
}

starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
sceneElements.starField = new THREE.Points(starsGeometry, starsMaterial);
scene.add(sceneElements.starField);

const camera = new THREE.PerspectiveCamera(75, box.clientWidth / box.clientHeight, 0.1, 1000000)
const controls = new OrbitControls(camera, renderer.domElement)

box.appendChild(renderer.domElement)

// 生成一个canvas对象，标注文字为参数name
function createCanvas(name1,text) {
    /**
     * 创建一个canvas对象，绘制几何图案或添加文字
     */
    const canvas = document.createElement("canvas");
    const arr = name1.split(""); //分割为单独字符串
    let num = 0;
    const reg = /[\u4e00-\u9fa5]/;
    for (let i = 0; i < arr.length; i++) {
        if (reg.test(arr[i])) { //判断是不是汉字
            num += 1;
        } else {
            num += 0.5; //英文字母或数字累加0.5
        }
    }
    // 根据字符串符号类型和数量、文字font-size大小来设置canvas画布宽高度
    const h = 100; //根据渲染像素大小设置，过大性能差，过小不清晰
    const w = 80;
    canvas.width = w;
    canvas.height = h;
    const h1 = h * 0.8;
    const c = canvas.getContext('2d');
    // 定义轮廓颜色，黑色半透明
    c.fillStyle = "rgba(102, 204, 255,0.5)";
    // 绘制半圆+矩形轮廓
    const R = h1 / 2;
    c.arc(R, R, R, -Math.PI / 2, Math.PI / 2, true); //顺时针半圆
    c.arc(R, R, R, Math.PI / 2, -Math.PI / 2, true); //顺时针半圆
    c.fill();
    // 绘制箭头
    c.beginPath();
    const h2 = h - h1;
    c.moveTo(R - h2 * 0.6, h1-2);
    c.lineTo(R + h2 * 0.6, h1-2);
    c.lineTo(R, h);
    c.fill();
    // 文字
    c.beginPath();
    c.translate(R, h1 / 2);
    c.fillStyle = "#ffffff"; //文本填充颜色
    c.font = "bold 30px 微软雅黑"; //字体样式设置
    c.textBaseline = "middle"; //文本与fillText定义的纵坐标
    c.textAlign = "center"; //文本居中(以fillText定义的横坐标)
    //c.fillText(name1, 0, -15);
    c.fillText(text, 0, 0);
    return canvas;
}

function createCable(point1, point2, radius = 0.3, color = 0x00ff00) {
    // 确保输入是Three.js向量，如果不是则转换
    const start = point1 instanceof THREE.Vector3 
        ? point1 
        : new THREE.Vector3(point1.x, point1.y, point1.z);
        
    const end = point2 instanceof THREE.Vector3 
        ? point2 
        : new THREE.Vector3(point2.x, point2.y, point2.z);

    // 计算两点之间的向量和长度
    const direction = new THREE.Vector3().subVectors(end, start);
    const length = direction.length();

    // 计算旋转四元数：使圆柱从Y轴朝向两点连线方向
    const quaternion = new THREE.Quaternion();
    quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),  // 原始方向（Y轴）
        direction.normalize()        // 目标方向（两点连线）
    );

    // 创建圆柱几何体
    const geometry = new THREE.CylinderGeometry(
        radius,    // 顶部半径
        radius,    // 底部半径
        length,    // 高度（两点距离）
        32         // 分段数（影响平滑度）
    );

    // 创建材质 - 增加自发光属性用于闪烁效果
    const material = new THREE.MeshStandardMaterial({
        color: 0x006400,
        metalness: 0.2,
        roughness: 0.8,
        emissive: color,           // 自发光颜色（与主色一致）
        emissiveIntensity: 0.2     // 初始发光强度
    });

    // 创建网格并设置位置和旋转
    const cylinder = new THREE.Mesh(geometry, material);
    
    // 存储材质引用，方便后续修改
    cylinder.cableMaterial = material;
    
    // 放置在两点中间
    cylinder.position.copy(
        new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5)
    );
    
    // 应用旋转
    cylinder.quaternion.copy(quaternion);

    return cylinder;
}

// 添加动画循环实现闪烁效果
function animate() {
    requestAnimationFrame(animate);
    // 计算闪烁因子（0~1之间波动）
    const time = Date.now() * 0.001;
    const blinkFactor = Math.sin(time * 5) * 0.5 + 0.5; // 5是闪烁频率
    // 遍历所有线缆，更新发光强度
    cableList.forEach(cylinder => {
        // 控制发光强度实现闪烁（0.5~2.0之间变化）
        cylinder.cableMaterial.emissiveIntensity = 0.5 + blinkFactor * 1.5;
    });
    renderer.render(scene, camera);
}
